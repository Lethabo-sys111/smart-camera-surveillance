# Copy to config.ini and fill in. config.ini is git-ignored (it holds the device key).

[server]
# Laravel API address as seen FROM THE PI (your laptop's LAN IP, or your VPS domain)
api_url = http://192.168.1.10:8080
# Must match DEVICE_KEY in backend/.env
device_key = change-me
device_id = cam-01

[camera]
# Resolution of saved photos and the live stream
width = 1280
height = 720
framerate = 15
# Flip if the camera is mounted upside down
hflip = false
vflip = false

[stream]
port = 8000

[motion]
# camera = detect motion from the video itself (no extra hardware)
# pir    = use a PIR sensor on a GPIO pin
# both   = either one triggers
source = camera
pir_pin = 17
# Camera-motion sensitivity: % of the picture that must change. Lower = more sensitive.
# Start at 1.5; raise it (e.g. 3) if you get false alarms, lower it (e.g. 0.8) if it misses people.
threshold = 1.5
# Photos per trigger, and the gap between them
burst_count = 3
burst_interval = 0.5
# After a burst, ignore motion for this many seconds (stops photo spam)
cooldown = 10

[timing]
heartbeat_interval = 5
